# Serves the SPA and proxies /api to the `api` compose service. TLS is terminated in front of this container (see deployment/Caddyfile).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 10m;  # the API enforces its own 8 MiB limit (NOVA_MAX_REQUEST_BODY_BYTES)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Client address: trust X-Forwarded-For only when the peer is a private address (the TLS proxy on the compose network, or a host proxy via the
  # localhost-bound port). Anyone else is identified by their own connection address. The result is what the API sees (below).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Docker's embedded DNS: resolve the API per request so an API container restart (new IP) does not leave nginx pointing at a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $nova_api http://api:8000;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /api/ {
    # The API sets its own security headers (nosniff, frame-ancestors, no-store); nginx adds none here so nothing is duplicated.
    proxy_pass $nova_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwritten, not appended: clients cannot inject addresses through this proxy
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Content-hashed bundles: cache for a year. A missing asset is a 404, never index.html (which would fail with a MIME error).
  location /assets/ {
    expires 1y;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    expires -1;  # index.html and the SPA fallback must always be revalidated so a new release is picked up
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
