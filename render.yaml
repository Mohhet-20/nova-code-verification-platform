# Render blueprint for the hosted public demo API. New > Blueprint > pick this repository.
# The website is the frontend on Vercel (frontend/vercel.json), which proxies /api/* here, so the browser only ever
# talks to its own origin. Image: deploy/demo/Dockerfile (showcase pre-analysed at build time, reset on every start,
# guest access on, repository test execution off). A real deployment uses backend/Dockerfile and deployment/.
services:
  - type: web
    name: nova-verification-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/demo/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # The owner's access key (full control). Generated by Render: copy it from the dashboard to sign in as owner.
      - key: NOVA_API_TOKEN
        generateValue: true
      - key: NOVA_CORS_ORIGINS
        value: https://nova-code-verification-platform.vercel.app
