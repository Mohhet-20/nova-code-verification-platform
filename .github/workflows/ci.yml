# NOVA continuous integration. Status: authored and YAML-validated locally; it has NEVER RUN on GitHub (the project folder is not yet a Git
# repository). The first run is part of docs/operations/RELEASE_CHECKLIST.md.
# Security notes:
#  - Triggered by `pull_request` (NOT `pull_request_target`), so code from forks runs with a read-only token and no repository secrets.
#  - Workflow-level permissions are read-only. No step uses secrets. Nothing is pushed, published or deployed.
#  - Third-party actions are pinned to full commit SHAs (resolved 2026-10-22 with `git ls-remote`); the comment names the tag.
#
# Required release gates: backend, frontend, security, containers. All four must pass before a release tag is created.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency consistency (pip check)
        run: python -m pip check
      - name: Lint (ruff, including flake8-bandit security rules)
        run: ruff check .
      - name: Migration chain matches the models (alembic check)
        run: |
          export NOVA_DATABASE_URL="sqlite:///$RUNNER_TEMP/ci.db"
          python -m app.release migrate --no-backup
          alembic check
      - name: Fresh install reaches head and passes integrity
        run: |
          export NOVA_DATABASE_URL="sqlite:///$RUNNER_TEMP/ci2.db"
          python -m app.release deploy --no-backup --backup-dir "$RUNNER_TEMP/bk"
          python -m app.release status
          python -m app.release integrity
      - name: API contract check
        run: python -m app.contracts
      - name: Tests
        timeout-minutes: 60
        run: python -m pytest -o addopts="" -p no:cacheprovider -q --junitxml=../backend-junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-junit
          path: backend-junit.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile (fails if package.json and the lockfile disagree)
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npx eslint src
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=../frontend-junit.xml
      - name: Production build
        run: npm run build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: frontend-junit
          path: frontend-junit.xml
          if-no-files-found: warn
          retention-days: 14

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Committed-secret scan
        run: python scripts/scan_secrets.py
      - name: Python dependency vulnerabilities (any known vulnerability fails)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23"
      - name: Frontend dependency vulnerabilities (high and critical fail the build)
        working-directory: frontend
        run: npm audit --audit-level=high

  containers:
    # Builds both images, checks the production guard, then boots the real compose stack and runs the deployment smoke test through the web
    # proxy, including the write workflow on a throwaway repository. Nothing is pushed; the env file holds values generated for this run only.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Generate a throwaway production.env and a sample repository
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          python3 scripts/make_sample_repo.py "$RUNNER_TEMP/repos/sample" --git
          sudo chown -R 10001:10001 "$RUNNER_TEMP/repos"
          {
            echo "NOVA_ENVIRONMENT=production"
            echo "NOVA_API_TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "NOVA_INTEGRATION_SECRET_KEY=$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "NOVA_CORS_ORIGINS=https://nova.ci.invalid"
            echo "NOVA_REPOS_HOST_DIR=$RUNNER_TEMP/repos"
            echo "NOVA_REGISTRATION_BASE_DIRS=/srv/repos"
            echo "NOVA_SOURCE_REVISION=${{ github.sha }}"
            echo "NOVA_TEST_EXECUTION_ENABLED=true"
          } > deployment/production.env
      - name: Build images (the source revision label comes from NOVA_SOURCE_REVISION in the env file)
        run: docker compose -f deployment/docker-compose.yml --env-file deployment/production.env build
      - name: Image runs as non-root and the production guard refuses an unconfigured start
        run: |
          test "$(docker run --rm --entrypoint id nova-api:local -u)" = "10001"
          if docker run --rm -e NOVA_ENVIRONMENT=production nova-api:local \
               python -c "from app.core.config import get_settings; from app.release import prodcheck; prodcheck.enforce_startup(get_settings())"; then
            echo "::error::the production guard accepted an unconfigured production start"; exit 1
          fi
          docker run --rm --entrypoint git nova-api:local --version
      - name: Start the stack (migrate -> api -> web)
        run: docker compose -f deployment/docker-compose.yml --env-file deployment/production.env up -d
      - name: Deployment smoke test through the web proxy
        run: |
          export NOVA_API_TOKEN="$(grep '^NOVA_API_TOKEN=' deployment/production.env | cut -d= -f2-)"
          python3 scripts/deployment_smoke.py --url http://127.0.0.1:8080 --web-url http://127.0.0.1:8080 --wait 120 \
            --write --repo-path /srv/repos/sample
      - name: Backup and isolated restore inside the API container
        run: |
          f="-f deployment/docker-compose.yml --env-file deployment/production.env"
          docker compose $f exec -T api python -m app.release backup --label ci
          b="$(docker compose $f exec -T api sh -c 'ls -d /data/backups/nova-backup-*-ci | tail -1')"
          docker compose $f exec -T api python -m app.release verify "$b"
          docker compose $f exec -T api python -m app.release restore "$b" --target /data/restore-ci
      - name: Graceful stop
        run: docker compose -f deployment/docker-compose.yml --env-file deployment/production.env stop -t 30
      - name: Logs on failure
        if: failure()
        run: docker compose -f deployment/docker-compose.yml --env-file deployment/production.env logs --no-color --tail 200
      - name: Remove the stack and its volumes
        if: always()
        run: docker compose -f deployment/docker-compose.yml --env-file deployment/production.env down -v || true
