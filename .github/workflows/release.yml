# NOVA release artifacts. Triggered ONLY by a version tag; never by branches or pull requests. It builds and attaches a release manifest and SBOM.
# It does NOT deploy anywhere and pushes no container image (add a registry job deliberately, with its own environment protection, if you need one).
# Nothing is signed or attested: the manifest records `signature: null`. Actions are pinned to commit SHAs (resolved 2026-10-22).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Tests (junit feeds the manifest)
        working-directory: backend
        run: python -m pytest -o addopts="" -p no:cacheprovider -q --junitxml=../backend-junit.xml
      - name: Release manifest and SBOM
        working-directory: backend
        env:
          NOVA_SOURCE_REVISION: ${{ github.sha }}
        run: python -m app.release manifest --junit ../backend-junit.xml --out ../release-manifest.json --sbom ../sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          path: |
            release-manifest.json
            sbom.cdx.json
            backend-junit.xml
          retention-days: 90

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only this job can write: attaches files to the GitHub release for the tag
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-${{ github.ref_name }}
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-manifest.json sbom.cdx.json --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Automated artifacts only (manifest, CycloneDX SBOM). Unsigned. See docs/operations/RELEASE.md."
