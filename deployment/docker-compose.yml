# Single-host NOVA deployment: SQLite, ONE API process, static web + reverse proxy. No secret is stored here; values come from an untracked env file.
# See docs/operations/DEPLOYMENT_GUIDE.md for the exact procedure.
#   cp deployment/production.env.example deployment/production.env      # fill in real values (file is git-ignored)
#   docker compose -f deployment/docker-compose.yml --env-file deployment/production.env build
#   docker compose -f deployment/docker-compose.yml --env-file deployment/production.env up -d
# Optional automatic HTTPS: add `-f deployment/docker-compose.tls.yml` to every command (see that file).
name: nova

x-api-build: &api-build
  context: ../backend
  args: { NOVA_SOURCE_REVISION: "${NOVA_SOURCE_REVISION:-unknown}" }

x-logging: &logging  # bounded container logs so a chatty service cannot fill the disk
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  migrate:  # one-shot release step: preflight -> verified pre-migration backup -> locked migration. Exits non-zero (blocking api) on failure.
    <<: *hardening
    build: *api-build
    image: nova-api:${NOVA_IMAGE_TAG:-local}
    command: ["python", "-m", "app.release", "deploy"]
    env_file: [production.env]
    volumes: [nova-data:/data]
    tmpfs: ["/tmp:size=64m"]
    restart: "no"
    logging: *logging

  api:
    <<: *hardening
    build: *api-build
    image: nova-api:${NOVA_IMAGE_TAG:-local}
    depends_on: { migrate: { condition: service_completed_successfully } }
    env_file: [production.env]
    environment:
      # The API port is only reachable from the compose network (no `ports:`), so the web proxy is the only client that can set
      # X-Forwarded-For. If you ever publish 8000 directly, replace "*" with the proxy's address.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - nova-data:/data
      # Repositories NOVA may register (must match NOVA_REGISTRATION_BASE_DIRS=/srv/repos). Read-write because approved repairs and
      # refactorings write to the working tree; files must be owned by uid 10001 or git reports "dubious ownership".
      - ${NOVA_REPOS_HOST_DIR:?set NOVA_REPOS_HOST_DIR in production.env}:/srv/repos
    tmpfs: ["/tmp:size=256m"]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    expose: ["8000"]
    logging: *logging

  web:
    <<: *hardening
    build: { context: ../frontend }
    image: nova-web:${NOVA_IMAGE_TAG:-local}
    depends_on: { api: { condition: service_healthy } }
    # Localhost only by default: put a TLS-terminating proxy in front (docker-compose.tls.yml or your own).
    ports: ["${NOVA_WEB_BIND:-127.0.0.1}:${NOVA_WEB_PORT:-8080}:8080"]
    tmpfs: ["/tmp:size=16m", "/var/cache/nginx:size=64m"]
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging

volumes:
  nova-data: {}
