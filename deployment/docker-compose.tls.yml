# Optional overlay: Caddy terminates TLS with automatic Let's Encrypt certificates for NOVA_DOMAIN and forwards to the web container.
# Requirements: a DNS A/AAAA record for NOVA_DOMAIN pointing at this host and inbound ports 80 and 443 open. NOT executed in the authoring environment.
#   docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.tls.yml --env-file deployment/production.env up -d
# With this overlay, keep NOVA_WEB_BIND=127.0.0.1 so plain HTTP on 8080 is not reachable from outside.
services:
  proxy:
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd  # resolved from Docker Hub 2026-10-22
    depends_on: { web: { condition: service_healthy } }
    environment:
      NOVA_DOMAIN: ${NOVA_DOMAIN:?set NOVA_DOMAIN in production.env to use the TLS overlay}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates and ACME account: must persist
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    restart: unless-stopped
    mem_limit: 256m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  caddy-data: {}
  caddy-config: {}
